<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Roadmap</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap');

:root{
  --blue-500:#00ABF4;
  --neutral-0:#FFFFFF;
  --neutral-50:#F7F8F9;
  --neutral-100:#E8E9EA;
  --neutral-150:#E1E1E1;
  --neutral-300:#A3A3A3;
  --neutral-500:#636D79;
  --neutral-700:#262626;
  --neutral-1000:#000000;
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--neutral-50);font-family:var(--font);color:var(--neutral-1000);}
.page{min-height:100vh;padding:32px 24px 96px;}
.inner{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:24px;}
h1{font:700 36px/1.1 var(--font);letter-spacing:-0.02em;margin:0;color:#000;}

.filters{display:flex;flex-direction:column;gap:12px;}
.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.filter-label{font:500 12px/1 var(--font);color:var(--neutral-500);width:88px;}
.chip{
  font:600 12px/1 var(--font);
  border-radius:9999px;
  padding:8px 12px;
  border:1.6px solid var(--neutral-100);
  background:#fff;
  color:#000;
  cursor:pointer;
  transition:all 120ms cubic-bezier(0.2,0.7,0.2,1);
}
.chip:hover{background:var(--neutral-100);}
.chip.on{border-color:#000;background:#000;color:#fff;}
.chip.on:hover{background:#000;}
.shown-count{font:400 12px/1 var(--font);color:var(--neutral-300);margin-left:8px;white-space:nowrap;}

.table-card{background:#fff;border:0.5px solid var(--neutral-150);border-radius:24px;overflow:hidden;}
.table-scroll{overflow-x:auto;}
.grid{min-width:1560px;}
.header-row, .row{
  display:grid;
  grid-template-columns:44px 1.1fr 1.2fr 1.1fr 1fr 1.2fr 150px 130px 150px;
  gap:0 18px;
  align-items:start;
}
.header-row{
  padding:20px 24px 14px;
  border-bottom:0.5px solid var(--neutral-150);
  position:sticky; top:0; background:#fff; z-index:2;
  border-radius:24px 24px 0 0;
}
.header-row span{font:800 13px/1.2 var(--font);letter-spacing:0.06em;text-transform:uppercase;color:#000;}
.row{padding:20px 24px;background:#fff;border-bottom:0.5px solid var(--neutral-150);}
.row:last-child{border-bottom:none;}

.num{width:32px;height:32px;border-radius:9999px;background:var(--neutral-100);display:flex;align-items:center;justify-content:center;font:700 13px/1 var(--font);color:var(--neutral-700);}
.proj-col{display:flex;flex-direction:column;gap:6px;}
.proj-name{font:700 16px/1.3 var(--font);color:#000;}
.proj-sub{font:400 12px/1.4 var(--font);color:var(--neutral-500);}
.proj-links{display:flex;flex-direction:column;gap:2px;}
.proj-links a{font:600 12px/1.4 var(--font);color:var(--blue-500);text-decoration:none;}
.proj-links a:hover{text-decoration:underline;}

.cell-text{font:400 14px/1.5 var(--font);color:#000;}
.cell-text.grey{color:var(--neutral-700);}

.status-col{display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
.status-pill{font:600 11px/1 var(--font);border-radius:9999px;padding:6px 10px;white-space:normal;text-align:left;}
.owner-text{font:400 12px/1.4 var(--font);color:var(--neutral-500);}

.prio-select{
  font:600 12px/1 var(--font);
  border-radius:9999px;
  padding:8px 12px;
  width:100%;
  box-sizing:border-box;
  outline:none;
  cursor:pointer;
  appearance:auto;
  border:1.6px solid var(--neutral-100);
  background:#fff;
  color:var(--neutral-500);
}

.assigned-input{
  font:500 14px/1.4 var(--font);
  border-radius:9999px;
  padding:8px 12px;
  width:100%;
  box-sizing:border-box;
  outline:none;
  border:1.6px solid var(--neutral-100);
  background:#fff;
  color:#000;
}
.assigned-input::placeholder{color:var(--neutral-300);}
.assigned-input:focus, .prio-select:focus{border-color:var(--blue-500);}

.empty-state{padding:40px;text-align:center;font:400 14px/1.5 var(--font);color:var(--neutral-300);}

@media (max-width:1000px){
  .table-scroll{overflow-x:auto;}
}
</style>
</head>
<body>
<div class="page">
  <div class="inner">
    <h1>Data Roadmap</h1>

    <div class="filters">
      <div class="filter-row" id="teamChipsRow"></div>
      <div class="filter-row" id="wsChipsRow"></div>
      <div class="filter-row" id="stChipsRow"></div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <div class="grid">
          <div class="header-row">
            <span></span>
            <span>Project</span>
            <span>What it is</span>
            <span>Why it matters</span>
            <span>Metrics</span>
            <span>Notes / Update from call</span>
            <span>Status / Team</span>
            <span>Priority</span>
            <span>Data team assigned</span>
          </div>
          <div id="rows"></div>
          <div class="empty-state" id="emptyState" style="display:none;">No projects match these filters</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const DATA = [
 {num:1,project:"Instant Insights Slackbot",links:[["Mockup","https://instant-insights-agent.vercel.app/"]],level:"Video",workstream:"Video Performance",owner:"YouTube Intelligence",what:"High-level video performance snapshot delivered to leadership in Slack, using a simple 1-10 ranking across key milestones (1h, 2h, 3h, 4h, 5h, 6h, 12h, 24h, 48h, 72h, 7d, 30d).",why:"Gives execs a fast read without opening a dashboard.",metrics:"Views, Engaged Views, Rankings – across milestones (1h, 2h, 3h, 4h, 5h, 6h, 12h, 24h, 48h, 72h, 7d, 30d) with changes over time.",notes:"We have hourly data for the first 30d. Needs visual mockups before dev builds it.",status:"Mockups created"},
 {num:2,project:"Upload Diagnostics",links:[["Mockup","https://colddatalabs.github.io/upload_diagnostics/"]],level:"Video",workstream:"Video Performance",owner:"YouTube Intelligence",what:"Granular early version of \"AAR\" for Regina, Chris, and Chucky to get insights.",why:"Catches under/over-performance in the first hours, not days later.",metrics:"Hourly breakdowns (hr 1-30d). Views, engaged views, CTR%, AVD, rankings, traffic sources with milestones, expected AVD + residuals. Alerts on abnormalities (e.g. 30% drop in a traffic source).",notes:"Will need to establish benchmarks for some traffic sources like Notifications.",status:"Mockups created"},
 {num:3,project:"Retention Analysis Tool",links:[["Mockup","https://colddatalabs.github.io/Retention-Analysis/"],["In progress in Beast Metrics","https://beta-mrbeastmetrics.vercel.app/dashboard/retention-analysis?channel=mrbeast&video_id=iYlODtkyw_I&video_title=Survive+30+Days+Chained+To+A+Stranger%2C+Win+%24250%2C000"]],level:"Video",workstream:"Video Performance",owner:"YouTube Intelligence",what:"A deep dive into a video's retention curve, which segments worked, which didn't, and why. Insights are split into data-backed facts vs. hypotheses",why:"Builds a shared playbook for what drives retention, to improve future videos, not just explain past ones",metrics:"Retention by Segments, Stopped Watching, Retention Loss, Written Insights",notes:"Will live separate and folded into Video AAR. Currently in beta, feedback passed to Matvey. Will have something to show soon.",status:"In progress"},
 {num:4,project:"Video AAR",links:[["Mockup","https://colddatalabs.github.io/AAR/"]],level:"Video",workstream:"Video Performance",owner:"YouTube Intelligence",what:"Simple, accessible \"silver platter\" format for creatives, plus an \"explorer\" mode for deeper analysis for those who want to dig into the data.",why:"One consistent format with everything in one place - instead of fragmented tools non-data people avoid.",metrics:"Rankings, traffic sources with milestones, expected AVD + residuals, stopped watching, with heavy written insights on performance.",notes:"Draws on Upload Insights (#2) and Retention Analysis (#3) underneath. Will share some of the infrastructure.",status:"Mockups created"},
 {num:5,project:"Shorts AAR",links:[],level:"Shorts",workstream:"Video Performance",owner:"YouTube Intelligence",what:"Same as long-form AR (#3) minus traffic sources. Simple, accessible 'silver platter' format for creatives.",why:"Extends the same easy-to-read performance view to Shorts, so creative decisions aren't just guesswork.",metrics:"Rankings, Sub conversion, Retention Goodness with residuals, Stopped Watching, Written Insights",notes:"Next phase can tackle IG/X/TikTok comparisons.",status:"Needs to be built"},
 {num:6,project:"AAR Top Takeaways",links:[],level:"Video",workstream:"Video Performance",owner:"YouTube Intelligence",what:"Summary of insights from past video AARs into actionable lessons and creative takeaways for future videos.",why:"Builds a shared knowledge base for the creative team, prevents repeat mistakes, and makes past learnings easy to reference and apply to future content.",metrics:"Written insights with visual retention graphs as needed",notes:"Needs to live in Beast OS and be accessible to writers for future reference.",status:"Needs to be built"},
 {num:7,project:"Social Listening",links:[],level:"Cross-platform",workstream:"External Intelligence",owner:"Social",what:"Tracks conversation about our brands across social platforms.",why:"Full picture of brand health: catches risks early, and shows what's resonating so we can lean into it.",metrics:"Sentiment, Mentions, Volume, Themes, Emerging Topics",notes:"Jordan researching Brandwatch and Cision, plus Meltwater - already used by Feastables. See Clipping (#7): tracked as its own project, but could be folded under the Social Listening bucket.",status:"In Search of 3rd Party Tool"},
 {num:8,project:"Clipping & Creator Tracking",links:[],level:"Cross-platform",workstream:"External Intelligence",owner:"Social",what:"Tracks social footprint across platforms for our own content/brand and for other creators.",why:"Quantifies 'social capital' and earned media beyond our owned channels, and looks beyond subscriber counts for other creators.",metrics:"Volume, Views, Engagement",notes:"Start with main-channel earned-media analysis. Jordan researching tools/contracts for social.",status:"In Search of 3rd Party Tool"},
 {num:9,project:"Trends & Outlier Digest",links:[["Evan's scraping of YT's Beta Research Feature","https://outlier-dashboard-gamma-nine.vercel.app/"]],level:"Cross-platform",workstream:"External Intelligence",owner:"YouTube Intelligence & Social",what:"Weekly digest and real-time alerts on trends, creators, formats, and outlier content by category.",why:"Replaces having someone 'chronically online' scanning for content inspiration.",metrics:"Views, Engagement",notes:"Need to research third-party tools for scraping data across social.",status:"Needs to be built"},
 {num:10,project:"Thumbnail A/B - Own Channels",links:[],level:"Video/Channel",workstream:"Creative Testing",owner:"YouTube Intelligence",what:"A historical log of every thumbnail change. Dive into individual tests and view cumulative performance over time, with lift tracked throughout.",why:"Shows the lift from tests, and builds a backlog of what creative elements actually work.",metrics:"Views, Engaged Views, Lift, Volume",notes:"Reached out to YouTube for a historical export of every A/B test we've run on our content, along with results.",status:"Needs to be built"},
 {num:11,project:"Thumbnail A/B - Competitors",links:[],level:"Cross-channel",workstream:"Creative Testing",owner:"YouTube Intelligence",what:"Same thumbnail-testing insight as #9, applied to competitor channels for inspiration and trend-spotting.",why:"Surfaces creative that's working elsewhere, for inspiration.",metrics:"Views, Lift, Volume, Trends",notes:"ViewStats scraping stopped (exceeded YouTube ToS). Still figuring out the path forward - third-party data buys or an alternate workaround.",status:"Blocked"},
 {num:12,project:"Monthly Channel Reports (MBR)",links:[["Gaming August","https://beastmetrics.co/r/5c31cfc8-805c-4ff0-8bd0-693d8f1b6915"],["Main July","https://beastmetrics.co/r/5d958450-4c6a-4f1f-a4cf-124595cc9864"]],level:"Channel",workstream:"Channel Performance",owner:"YouTube Intelligence",what:"Channel-level monthly and YTD performance, performance at macro level.",why:"Gives a channel-level view, not just video-level.",metrics:"Views, Engaged Views, Rankings, Global vs US rankings, Location, Dubbing/Languages, Formats, Engagement, Comment Analysis",notes:"Active on gaming channel only, needs to be expanded to main and other channels.",status:"In progress"},
 {num:13,project:"Shorts A/B Testing (Trials)",links:[],level:"Shorts",workstream:"Creative Testing",owner:"YouTube Intelligence",what:"Internal tracker for Shorts creative tests, lift, sub conversion and learnings.",why:"Improve viewer retention and conversion.",metrics:"Engaged Views, Retention, Sub Conversion, Lift",notes:"Not urgent",status:"Needs to be built"},
 {num:14,project:"Long-Form A/B Testing",links:[],level:"Video",workstream:"Creative Testing",owner:"YouTube Intelligence",what:"Internal tracker for testing hooks, pacing, and edits on long-form videos.",why:"Improve viewer retention.",metrics:"Views, Engaged Views, Retention, Lift",notes:"Not urgent",status:"Needs to be built"}
];

const STATUS = {
 "In progress":{bg:"#E7FBEF",fg:"#166534"},
 "Mockups created":{bg:"#EAF7FE",fg:"#0074A8"},
 "In Search of 3rd Party Tool":{bg:"#F9F7E0",fg:"#7A5B00"},
 "Needs to be built":{bg:"#E8E9EA",fg:"#262626"},
 "Blocked":{bg:"#FAECEA",fg:"#991B1B"}
};
const PRIO_COLOR = {
 "":{bg:"#fff",fg:"#636D79",bd:"#E8E9EA"},
 High:{bg:"#FAECEA",fg:"#991B1B",bd:"#F3C9C4"},
 Medium:{bg:"#F9F7E0",fg:"#7A5B00",bd:"#EDE3A0"},
 Low:{bg:"#E7FBEF",fg:"#166534",bd:"#BFEBD0"},
 Unset:{bg:"#fff",fg:"#636D79",bd:"#E8E9EA"}
};
const WS = ["Video Performance","External Intelligence","Creative Testing","Channel Performance"];
const ST = Object.keys(STATUS);
const TEAMS = ["YouTube Intelligence","Social"];
const PRIOS = ["","High","Medium","Low","Unset"];
const LS_KEY = "vyro-data-roadmap-edits";

let state = { team:"All", ws:"All", st:"All", edits:{} };
try { state.edits = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch(e) { state.edits = {}; }

function saveEdits(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state.edits)); } catch(e) {}
}
function setEdit(num, key, val){
  state.edits[num] = { ...(state.edits[num]||{}), [key]: val };
  saveEdits();
  render();
}

function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? "" : s;
  return d.innerHTML;
}

function renderChips(containerId, options, key){
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  ["All", ...options].forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (state[key] === v ? ' on' : '');
    btn.textContent = v;
    btn.addEventListener('click', () => { state[key] = v; render(); });
    el.appendChild(btn);
  });
}

function render(){
  renderChips('teamChipsRow', TEAMS, 'team');
  document.getElementById('teamChipsRow').insertAdjacentHTML('afterbegin', '<span class="filter-label">Team</span>');
  renderChips('wsChipsRow', WS, 'ws');
  document.getElementById('wsChipsRow').insertAdjacentHTML('afterbegin', '<span class="filter-label">Workstream</span>');
  renderChips('stChipsRow', ST, 'st');
  document.getElementById('stChipsRow').insertAdjacentHTML('afterbegin', '<span class="filter-label">Status</span>');

  const filtered = DATA.filter(d =>
    (state.team === "All" || d.owner.includes(state.team)) &&
    (state.ws === "All" || d.workstream === state.ws) &&
    (state.st === "All" || d.status === state.st)
  );

  const shownCount = document.createElement('span');
  shownCount.className = 'shown-count';
  shownCount.id = 'shownCount';
  shownCount.textContent = `${filtered.length} of ${DATA.length}`;
  document.getElementById('stChipsRow').appendChild(shownCount);

  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = "";
  document.getElementById('emptyState').style.display = filtered.length === 0 ? 'block' : 'none';

  filtered.forEach((d, i) => {
    const s = STATUS[d.status] || {bg:"#eee", fg:"#333"};
    const edit = state.edits[d.num] || {};
    const prio = edit.priority || "";
    const pc = PRIO_COLOR[prio] || PRIO_COLOR[""];
    const assigned = edit.assigned || "";

    const row = document.createElement('div');
    row.className = 'row';
    if (i === filtered.length - 1) row.style.borderBottom = 'none';

    row.innerHTML = `
      <span class="num">${d.num}</span>
      <div class="proj-col">
        <span class="proj-name">${esc(d.project)}</span>
        <span class="proj-sub">${esc(d.workstream)} · ${esc(d.level)}</span>
        <div class="proj-links">
          ${d.links.map(([label, href]) => `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>`).join('')}
        </div>
      </div>
      <span class="cell-text">${esc(d.what)}</span>
      <span class="cell-text">${esc(d.why)}</span>
      <span class="cell-text grey">${esc(d.metrics)}</span>
      <span class="cell-text grey">${esc(d.notes)}</span>
      <div class="status-col">
        <span class="status-pill" style="background:${s.bg};color:${s.fg};">${esc(d.status)}</span>
        <span class="owner-text">${esc(d.owner)}</span>
      </div>
      <div></div>
      <div></div>
    `;

    const prioCell = row.children[7];
    const select = document.createElement('select');
    select.className = 'prio-select';
    select.style.borderColor = pc.bd;
    select.style.background = pc.bg;
    select.style.color = pc.fg;
    PRIOS.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt;
      o.textContent = opt === "" ? "—" : opt;
      if (opt === prio) o.selected = true;
      select.appendChild(o);
    });
    select.addEventListener('change', e => setEdit(d.num, 'priority', e.target.value));
    prioCell.appendChild(select);

    const assignedCell = row.children[8];
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'assigned-input';
    input.placeholder = '—';
    input.value = assigned;
    input.addEventListener('change', e => setEdit(d.num, 'assigned', e.target.value));
    assignedCell.appendChild(input);

    rowsEl.appendChild(row);
  });
}

render();
</script>
</body>
</html>
